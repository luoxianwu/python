abf_packet:
  sync: [0x55, 0xAA]
  packet_length: ~
  function: 0x06        # poke command
  reserved: 0
  data:
    - 0x00008002        # address
    - 0x02              # size
    - 0xcc              # poke data
    - 0xdd
    - 0x00008000        # address
    - 0x02              # size
    - 0xAA              # poke data
    - 0xbb    
  crc32: ~